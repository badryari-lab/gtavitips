<base href="/map/interactive/" target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="app">
  <aside id="paneel" aria-label="Map layers">
    <header class="paneel-kop">
      <a class="merk" href="https://gtavitips.com/">GTAVITIPS</a>
      <h1>Leonida <span>Interactive map</span></h1>
    </header>

    <div class="zoek">
      <input id="zoek" type="search" placeholder="Search the map" autocomplete="off" aria-label="Search the map">
      <ul id="zoekresultaten" hidden></ul>
    </div>

    <div class="knoppen">
      <button type="button" data-actie="alles">Show all</button>
      <button type="button" data-actie="niets">Hide all</button>
      <button type="button" data-actie="gevonden" aria-pressed="false">Hide found</button>
    </div>

    <nav id="lagen"></nav>

    <footer class="paneel-voet">
      <p>Map tiles: gtadb.org and contributors (CC BY 4.0). Poster: Rockstar Games. Icons: Phosphor Icons (MIT).</p>
      <p><span class="stip stip-open"></span> Dashed pin: approximate position</p>
    </footer>
  </aside>

  <main id="kaartvak">
    <div id="kaart"></div>
    <div id="basiskeuze" role="group" aria-label="Base map">
      <button type="button" data-basis="game" aria-pressed="true">In-game</button>
      <button type="button" data-basis="poster" aria-pressed="false">Poster</button>
    </div>
    <button id="paneelknop" type="button" aria-controls="paneel" aria-expanded="true">Layers</button>
    <div id="positie" aria-live="polite"></div>
    <div id="bewerkbalk" hidden>
      <strong>Edit mode</strong>
      <span id="bewerkinfo">Click the map to read a position. Drag pins to move them.</span>
      <button type="button" id="exporteer">Copy changed pins</button>
    </div>
  </main>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="kaart.js"></script>
</body>
